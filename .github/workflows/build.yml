name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend -c Release
      - run: python3 tests/integration.py
      - run: dotnet publish backend -c Release -o output/backend
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-backend
          path: output/backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-driver-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
